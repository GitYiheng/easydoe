n_samples: 30
seed: 42
output: experiments.csv

params:
  lr:
    type: log
    low: 1.0e-5
    high: 1.0e-2

  dropout:
    type: linear
    low: 0.1
    high: 0.5

  batch_size:
    type: choice
    values: [16, 32, 64]

  wd:
    type: log
    low: 1.0e-6
    high: 1.0e-3

  hidden_dim:
    type: int
    low: 128
    high: 512